{title:'Prejuízo funcional',desc:'Classifique impacto atual de 0 (nenhum) a 10 (extremo).',fields:[f('prejuizos','Áreas da vida','scale',{options:['Trabalho','Faculdade/estudos','Finanças','Relacionamentos','Casamento','Amizades','Filhos','Saúde','Autocuidado','Produtividade','Autoestima']})]},
{title:'História profissional',desc:'Identifique padrões, contexto e consequências ocupacionais.',fields:[f('empregos','Quantos empregos teve?'),f('profissional_sinais','Ocorrências profissionais','checks',{options:['Mudanças frequentes','Demissões','Atrasos','Perda de prazos','Acúmulo de tarefas','Procrastinação']}),f('historia_profissional','Exemplos e contexto','textarea')]},

{title:'Diagnósticos diferenciais',desc:'Sinalize fatores que precisam ser investigados antes de concluir hipóteses.',fields:[f('diferenciais','Requer investigação adicional','checks',{options:['Ansiedade/TAG','Depressão','TOC','TEA','Transtorno bipolar','Burnout','Luto','Trauma','Privação de sono','Apneia','Uso de substâncias','Condição médica relevante']}),f('diferenciais_obs','Evidências, temporalidade e observações','textarea')]},
{title:'Pontos fortes',desc:'Mapeie recursos que podem apoiar avaliação e tratamento.',fields:[f('forcas','Recursos identificados','checks',{options:['Criatividade','Hiperfoco','Resolução de problemas','Empatia','Curiosidade','Comunicação','Persistência','Interesses especiais']}),f('forcas_obs','Outros recursos e exemplos','textarea')]},
{title:'Objetivos do paciente',desc:'Transforme expectativas em indicadores observáveis de melhora.',fields:[f('objetivo_melhora','O que deseja melhorar?','textarea'),f('area_prioridade','Qual área da vida é prioridade?'),f('indicador_melhora','Como saberá que houve melhora?','textarea')]},
{title:'Síntese clínica inicial',desc:'Revise, edite e complemente. A decisão clínica permanece com o psicólogo.',summary:true}

let state={step:0,answers:{},summary:{},status:'rascunho',patientId:'',patientName:''};let timer;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function key(){return `psireal:ic-tdah:${uid||'local'}:${state.patientId||'sem-paciente'}`}
function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
function renderSteps(){$('steps').innerHTML=stages.map((s,i)=>`<button class="step-link ${i===state.step?'active':''} ${i<state.step?'done':''}" onclick="go(${i})"><b>${i<state.step?'✓':i+1}</b><span>${esc(s.title)}</span></button>`).join('')}
function input(field){const v=state.answers[field.id]??'';if(field.type==='textarea')return `<div class="field ${field.wide?'wide':''}"><label>${esc(field.label)}</label><textarea data-id="${field.id}">${esc(v)}</textarea></div>`;if(field.type==='radio')return `<div class="field wide"><div class="group-label">${esc(field.label)}</div><div class="choices">${field.options.map(o=>`<div class="choice"><input type="radio" id="${field.id}-${esc(o)}" name="${field.id}" value="${esc(o)}" ${v===o?'checked':''}><label for="${field.id}-${esc(o)}">${esc(o)}</label></div>`).join('')}</div></div>`;if(field.type==='checks'){const vals=Array.isArray(v)?v:[];return `<div class="field wide"><div class="group-label">${esc(field.label)}</div><div class="check-grid">${field.options.map(o=>`<label class="check"><input type="checkbox" data-group="${field.id}" value="${esc(o)}" ${vals.includes(o)?'checked':''}>${esc(o)}</label>`).join('')}</div></div>`}if(field.type==='scale'){const vals=v||{};return `<div class="field wide"><div class="group-label">${esc(field.label)}</div>${field.options.map(o=>`<div class="scale-row"><span>${esc(o)}</span><input type="range" min="0" max="10" value="${vals[o]??0}" data-scale="${field.id}" data-item="${esc(o)}"><span class="scale-val">${vals[o]??0}</span></div>`).join('')}</div>`}return `<div class="field"><label>${esc(field.label)}</label><input data-id="${field.id}" type="${field.type}" value="${esc(v)}"></div>`}
function collect(){document.querySelectorAll('[data-id]').forEach(el=>state.answers[el.dataset.id]=el.value);document.querySelectorAll('input[type=radio]:checked').forEach(el=>state.answers[el.name]=el.value);document.querySelectorAll('[data-group]').forEach(el=>{const id=el.dataset.group;state.answers[id]=[...document.querySelectorAll(`[data-group="${id}"]:checked`)].map(x=>x.value)});document.querySelectorAll('[data-scale]').forEach(el=>{const id=el.dataset.scale;state.answers[id]=state.answers[id]||{};state.answers[id][el.dataset.item]=Number(el.value)});document.querySelectorAll('[data-summary]').forEach(el=>state.summary[el.dataset.summary]=el.value)}
function bind(){document.querySelectorAll('input,textarea,select').forEach(el=>{el.addEventListener('input',()=>{collect();if(el.type==='range')el.nextElementSibling.textContent=el.value;scheduleSave()});el.addEventListener('change',()=>{collect();scheduleSave()})})}
function list(v){return Array.isArray(v)&&v.length?v:['Não informado']}
function buildSummary(){const a=state.answers;const p=a.prejuizos||{};const impacts=Object.entries(p).filter(([,v])=>v>=6).sort((x,y)=>y[1]-x[1]).map(([k,v])=>`${k} (${v}/10)`);const signs=[...(a.organizacao||[]),...(a.atencao||[]),...(a.memoria||[]),...(a.executivas||[]),...(a.impulsividade||[]),...(a.hiperatividade||[])];const temporal=[a.inicio_dificuldades,a.curso].filter(Boolean);const dif=list(a.diferenciais);const strengths=list(a.forcas);state.summary={motivo:a.motivo_procura||a.dificuldade_principal||'Não informado',temporal:temporal.join('; ')||'Temporalidade ainda não estabelecida',impactos:impacts.length?impacts.join('\n'):'Prejuízo funcional relevante ainda não documentado',achados:signs.length?signs.slice(0,12).join('\n'):'Necessário aprofundar exemplos observáveis',diferenciais:dif.join('\n'),forcas:strengths.join('\n'),hipotese:`Os dados organizados até o momento ${temporal.some(x=>/Infância|Sempre/i.test(x))?'incluem relato de início precoce e persistência':'ainda requerem confirmação da trajetória temporal'}${signs.length?`, com dificuldades descritas em ${signs.length} indicadores de funcionamento cotidiano`:''}. Estes achados podem ser compatíveis com dificuldades de atenção e/ou funções executivas, mas não estabelecem diagnóstico. Recomenda-se integrar entrevista aprofundada, histórico do desenvolvimento, prejuízo em múltiplos contextos, informações de terceiros quando disponíveis, diagnósticos diferenciais e avaliação interdisciplinar quando pertinente.`,formulacao:`Pensamentos e crenças a explorar: relação entre desempenho, autocrítica, fracasso e necessidade de compensação.\nEstratégias de manutenção a investigar: evitação, procrastinação, urgência, excesso de controle e dependência de pressão externa.\nFatores de proteção: ${strengths.join(', ')||'a identificar'}.\nObjetivo inicial: ${a.objetivo_melhora||a.problema_prioritario||'definir colaborativamente'}.\nPrimeiras sessões: validar prejuízos, construir linha do tempo, mapear ciclos situação-pensamento-emoção-ação e testar apoios ambientais.`};return state.summary}
function summaryView(){if(!Object.keys(state.summary).length)buildSummary();const blocks=[['motivo','Motivo principal'],['temporal','Padrão temporal'],['impactos','Áreas mais impactadas'],['achados','Achados relevantes'],['diferenciais','Fatores para investigação adicional'],['forcas','Aspectos positivos'],['hipotese','Hipótese clínica inicial'],['formulacao','Formulação cognitiva inicial']];return `<div class="warning"><strong>Revisão obrigatória:</strong> esta síntese organiza informações relatadas. Não realiza diagnóstico e não deve ser enviada sem revisão profissional.</div><div class="summary">${blocks.map(([k,t])=>`<div class="summary-block"><h3>${t}</h3><textarea data-summary="${k}">${esc(state.summary[k]||'')}</textarea></div>`).join('')}</div><div style="margin-top:16px"><button class="btn primary" onclick="finish()">Concluir investigação</button></div>`}
function render(){const s=stages[state.step];$('stage').textContent=`Etapa ${state.step+1} de ${stages.length}`;$('title').textContent=s.title;$('description').textContent=s.desc;$('progress').style.width=`${((state.step+1)/stages.length)*100}%`;$('form').innerHTML=s.summary?summaryView():`<div class="grid">${s.fields.map(input).join('')}</div>`;$('prev').disabled=state.step===0;$('next').style.display=s.summary?'none':'';$('next').textContent=state.step===stages.length-2?'Gerar síntese →':'Próxima etapa →';renderSteps();bind();window.scrollTo({top:0,behavior:'smooth'})}
function go(i){collect();state.step=Math.max(0,Math.min(stages.length-1,i));if(stages[state.step].summary)buildSummary();save();render()}
$('prev').onclick=()=>go(state.step-1);$('next').onclick=()=>go(state.step+1);
function scheduleSave(){clearTimeout(timer);$('saveText').textContent='Salvando…';timer=setTimeout(save,700)}
async function save(){collect();localStorage.setItem(key(),JSON.stringify(state));$('saveText').textContent='Salvo neste dispositivo';if(!token||!uid||!state.patientId)return;try{const body={psi_user_id:uid,paciente_id:state.patientId,paciente_nome:state.patientName,modulo:'IC-TDAH',status:state.status,etapa_atual:state.step+1,respostas:state.answers,sintese:state.summary,updated_at:new Date().toISOString()};const r=await fetch(`${SB_URL}/rest/v1/investigacoes_clinicas?on_conflict=psi_user_id,paciente_id,modulo`,{method:'POST',headers:{apikey:SB_KEY,Authorization:`Bearer ${token}`,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},body:JSON.stringify(body)});if(!r.ok)throw new Error();$('saveText').textContent='Salvo na sua conta'}catch(e){$('saveText').textContent='Salvo neste dispositivo'}}
function loadDraft(){const raw=localStorage.getItem(key());if(raw){const d=JSON.parse(raw);state={...state,...d,patientId:state.patientId,patientName:state.patientName};$('statusPill').textContent=state.status==='concluido'?'Concluído':'Rascunho'}render()}
async function loadPatientDraft(){let loaded=false;if(token&&state.patientId){try{const r=await fetch(`${SB_URL}/rest/v1/investigacoes_clinicas?psi_user_id=eq.${uid}&paciente_id=eq.${state.patientId}&modulo=eq.IC-TDAH&select=status,etapa_atual,respostas,sintese&limit=1`,{headers:{apikey:SB_KEY,Authorization:`Bearer ${token}`}});if(r.ok){const rows=await r.json();if(rows[0]){state.step=Math.max(0,Math.min(stages.length-1,(rows[0].etapa_atual||1)-1));state.answers=rows[0].respostas||{};state.summary=rows[0].sintese||{};state.status=rows[0].status||'rascunho';localStorage.setItem(key(),JSON.stringify(state));loaded=true}}}catch(e){}}if(!loaded)loadDraft();else{$('statusPill').textContent=state.status==='concluido'?'Concluído':'Rascunho';render()}}
async function loadPatients(){if(!token)return;try{const r=await fetch(`${SB_URL}/rest/v1/pacientes?select=id,nome,status&order=nome.asc`,{headers:{apikey:SB_KEY,Authorization:`Bearer ${token}`}});if(!r.ok)return;const rows=await r.json();$('patientSelect').innerHTML='<option value="">Selecione um paciente</option>'+rows.map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join('')}catch(e){}}
$('patientSelect').onchange=async e=>{collect();await save();state={step:0,answers:{},summary:{},status:'rascunho',patientId:e.target.value,patientName:e.target.selectedOptions[0]?.text||''};await loadPatientDraft();if(!state.answers.nome&&state.patientName)state.answers.nome=state.patientName;render()};
async function finish(){collect();state.status='concluido';$('statusPill').textContent='Concluído';await save();toast('Investigação concluída e salva.')}
loadPatients();render();
</script>
</body></html>
