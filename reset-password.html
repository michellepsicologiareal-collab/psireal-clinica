<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Redefinir senha | PsiReal Instrumentos</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d1730;
      --muted: #766b8f;
      --purple: #7049cf;
      --purple-dark: #5735b0;
      --line: #e5dff1;
      --danger: #a34f18;
      --success: #26734d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f7f6fb;
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 430px);
      padding: 34px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 50px rgba(45, 31, 79, .12);
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .brand img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
    .brand strong { font-size: 18px; }
    h1 { margin: 0 0 8px; font-size: 27px; line-height: 1.2; }
    p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
    label { display: block; margin: 16px 0 7px; font-size: 14px; font-weight: 700; }
    input {
      width: 100%;
      min-height: 48px;
      padding: 0 14px;
      border: 1px solid #d9d1e7;
      border-radius: 7px;
      color: var(--ink);
      font: inherit;
      outline: none;
    }
    input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(112, 73, 207, .14); }
    button, .link-button {
      width: 100%;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
      border: 0;
      border-radius: 7px;
      background: var(--purple);
      color: #fff;
      font: 700 16px/1 inherit;
      text-decoration: none;
      cursor: pointer;
    }
    button:hover { background: var(--purple-dark); }
    button:disabled { opacity: .65; cursor: wait; }
    .message { display: none; margin: 16px 0 0; text-align: center; font-size: 14px; line-height: 1.45; }
    .message.error { display: block; color: var(--danger); }
    .message.success { display: block; color: var(--success); }
    .expired { display: none; }
    @media (max-width: 520px) {
      body { padding: 16px; }
      main { padding: 26px 20px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <img src="icon-192.png" alt="">
      <strong>PsiReal Instrumentos</strong>
    </div>

    <section id="resetSection">
      <h1>Crie uma nova senha</h1>
      <p>Escolha uma senha com pelo menos 8 caracteres.</p>
      <form id="resetForm">
        <label for="newPassword">Nova senha</label>
        <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required>
        <label for="confirmPassword">Confirme a nova senha</label>
        <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
        <button id="submitButton" type="submit">Salvar nova senha</button>
      </form>
      <div id="message" class="message" role="alert" aria-live="polite"></div>
    </section>

    <section id="expiredSection" class="expired">
      <h1>Link inválido ou expirado</h1>
      <p>Solicite um novo e-mail de recuperação e abra somente o link mais recente.</p>
      <a class="link-button" href="painel-tcc.html">Voltar ao login</a>
    </section>
  </main>

  <script>
    const SB_URL = 'https://qpwjxacdjzzsyjbuuwsq.supabase.co';
    const SB_KEY = 'sb_publishable_hQclCJaEsVjcnGM4WAoYmA_r8H8NqAp';
    const hash = new URLSearchParams(location.hash.slice(1));
    const query = new URLSearchParams(location.search);
    const accessToken = hash.get('access_token');
    const recoveryError = hash.get('error_description') || query.get('error_description');
    const isRecovery = hash.get('type') === 'recovery' || Boolean(accessToken);

    const resetSection = document.getElementById('resetSection');
    const expiredSection = document.getElementById('expiredSection');
    const form = document.getElementById('resetForm');
    const message = document.getElementById('message');
    const button = document.getElementById('submitButton');

    if (!isRecovery || recoveryError) {
      resetSection.style.display = 'none';
      expiredSection.style.display = 'block';
    }

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('newPassword').value;
      const confirmation = document.getElementById('confirmPassword').value;

      if (password.length < 8) {
        showMessage('A senha deve ter pelo menos 8 caracteres.', 'error');
        return;
      }
      if (password !== confirmation) {
        showMessage('As senhas digitadas não são iguais.', 'error');
        return;
      }

      button.disabled = true;
      button.textContent = 'Salvando...';
      showMessage('', '');

      try {
        const response = await fetch(`${SB_URL}/auth/v1/user`, {
          method: 'PUT',
          headers: {
            apikey: SB_KEY,
            Authorization: `Bearer ${accessToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ password })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.msg || result.message || result.error_description || 'Não foi possível alterar a senha.');

        form.style.display = 'none';
        showMessage('Senha alterada. Você já pode entrar no PsiReal Instrumentos.', 'success');
        const loginLink = document.createElement('a');
        loginLink.className = 'link-button';
        loginLink.href = 'painel-tcc.html';
        loginLink.textContent = 'Entrar na plataforma';
        message.insertAdjacentElement('afterend', loginLink);
        history.replaceState(null, '', location.pathname);
      } catch (error) {
        showMessage(error.message || 'O link expirou. Solicite um novo e-mail.', 'error');
        button.disabled = false;
        button.textContent = 'Salvar nova senha';
      }
    });
  </script>
</body>
</html>
